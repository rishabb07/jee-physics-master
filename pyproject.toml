[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jee-physics"
version = "0.1.0"
description = "Deterministic foundational engine for the AI-powered JEE Physics knowledge and learning system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "JEE Physics Engineering Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "pypdf>=5.0.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
jee-physics = "jee_physics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
