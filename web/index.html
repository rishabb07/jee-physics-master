<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE Physics Master — Interactive Platform</title>
  <meta name="description" content="Continuously synchronized interactive digital learning platform for JEE Advanced and Main Physics. Grounded in canonical verified knowledge.">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="theme-light">
  <div id="app-container">
    <!-- Top Navigation Header -->
    <header id="top-nav">
      <div class="nav-left">
        <button id="sidebar-toggle" aria-label="Toggle Navigation Sidebar" title="Toggle Sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <a href="#/" class="brand-logo">
          <span class="logo-badge">JEE</span>
          <span class="logo-title">Physics Master</span>
          <span class="version-tag">v1.0-pilot</span>
        </a>
      </div>

      <div class="nav-center">
        <div class="search-box-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="global-search-input" placeholder="Search concepts, formulas, questions, topics... (Ctrl+K)" autocomplete="off">
          <div id="search-dropdown" class="search-dropdown hidden"></div>
        </div>
      </div>

      <div class="nav-right">
        <nav class="nav-links">
          <a href="#/curriculum" class="nav-link" data-route="curriculum">Syllabus</a>
          <a href="#/formulas" class="nav-link" data-route="formulas">Formulas</a>
          <a href="#/practice" class="nav-link" data-route="practice">Practice</a>
          <a href="#/ladders" class="nav-link" data-route="ladders">Ladders</a>
          <a href="#/progress" class="nav-link" data-route="progress">Progress</a>
        </nav>
        <button id="theme-toggle" class="icon-button" aria-label="Toggle Dark/Light Mode" title="Toggle Theme">
          <span class="theme-icon">&#9790;</span>
        </button>
      </div>
    </header>

    <!-- Main Application Layout -->
    <div id="app-body">
      <!-- Collapsible Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-header">
          <h3>Physics Curriculum</h3>
          <span class="badge badge-subtle">30 Chapters</span>
        </div>
        <div class="sidebar-filter">
          <input type="text" id="sidebar-filter-input" placeholder="Filter chapters...">
        </div>
        <nav id="sidebar-nav" class="sidebar-menu" aria-label="Curriculum Navigation">
          <div class="loading-spinner">Loading chapters...</div>
        </nav>
      </aside>

      <!-- Main Content Stage -->
      <main id="main-content" role="main">
        <div id="view-outlet">
          <div class="loading-container">
            <div class="spinner"></div>
            <p>Initializing JEE Physics Master Knowledge Base...</p>
          </div>
        </div>
      </main>
    </div>

    <!-- Toast Notification Banner -->
    <div id="toast-container" aria-live="polite"></div>
  </div>

  <!-- KaTeX Offline Engine -->
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/auto-render.min.js"></script>

  <!-- Modular ES6 Application -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
